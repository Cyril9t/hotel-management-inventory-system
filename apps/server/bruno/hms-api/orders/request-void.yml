info:
  name: Request Void Sale
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/sales/{{saleId}}/request-void"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{saleId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "voidReason": "Incorrect item entered"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
