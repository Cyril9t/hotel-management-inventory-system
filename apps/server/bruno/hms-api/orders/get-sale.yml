info:
  name: Get Sale
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/sales/{{saleId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{saleId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
