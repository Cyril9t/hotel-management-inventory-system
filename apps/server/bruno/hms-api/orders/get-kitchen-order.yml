info:
  name: Get Kitchen Order
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/kitchen-orders/{{kitchenOrderId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{kitchenOrderId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
