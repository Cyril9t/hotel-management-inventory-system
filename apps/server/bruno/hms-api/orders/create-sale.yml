info:
  name: Create Sale
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/sales"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "sourceDepartment": "RESTAURANT",
        "items": [
          {
            "productId": "{{productId}}",
            "quantity": 2
          }
        ],
        "paymentMethod": "CASH",
        "chargeToRoomBookingId": "{{bookingId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
