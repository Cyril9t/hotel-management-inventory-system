info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Parse the response body
        const response = res.getBody(); 

        const token = response.data.accessToken; 

        if (token) {
          bru.setVar("token", token);
          console.log("Token saved successfully!");
        } else {
          console.error("Token not found in response.");
        }

        const headerCookie = res.getHeader("set-cookie");

        if (headerCookie) {
            const matches = headerCookie.match(/refreshToken=([^;]+)/);
            const refreshToken = matches ? matches[1] : null;

            if (refreshToken) {
                bru.setVar("refreshToken", refreshToken);
                console.log("Refresh token saved successfully!");
            }
        }


