info:
  name: Refresh Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
