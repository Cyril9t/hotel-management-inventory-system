info:
  name: Refresh Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh"
  headers:
    - name: Content-Type
      value: application/json
    - name: Cookie
      value: refreshToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJhMTQ2MzhkNS0xMGI2LTQ1YTktOTNjOC1hN2E4NjlhZWU3MzgiLCJqdGkiOiI0ZGVjN2Q3Ny01YzczLTQ1ZWYtODFkZC1jZmMyYzAwNTQzMjUiLCJpYXQiOjE3OTIzMzY2MDIsImV4cCI6MTc5Mjk0MTQwMn0.aNgD63muieXY8u6JIANcyLb2mfI8i-r5MTltepDmQdM
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("refreshToken");
        req.setHeader("Cookie", `refreshToken=${token}`);
    - type: after-response
      code: |-
        // Parse the response body
        const response = res.getBody(); 
        const cookie = res.getHeader("set-cookie")

        const token = response.data.accessToken;

        if (cookie.refreshToken) {
          bru.setVar("refreshToken",cookie.refreshToken)
        }

        if (token) {
          bru.setVar("token", token);
          console.log("Token saved successfully!");
        } else {
          console.error("Token not found in response.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
