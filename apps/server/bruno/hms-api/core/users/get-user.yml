info:
  name: Get User By ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{userId}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: userId
      value: da34c5f7-e4ca-4378-bda9-b3d487e1b45e
  scripts:
    - type: before-request
      code: |-
        const userId = "00000000-0000-0000-0000-000000000000"

        bru.setVar("userId", userId)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
