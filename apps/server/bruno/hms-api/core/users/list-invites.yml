info:
  name: List Invites
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/invites"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: role
      value: "{{role}}"
      type: query
    - name: department
      value: "{{department}}"
      type: query
    - name: status
      value: "{{status}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: role
      value: owner

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
