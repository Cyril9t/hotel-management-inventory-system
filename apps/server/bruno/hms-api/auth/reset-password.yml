info:
  name: Reset Password
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{resetToken}}",
        "password": "NewPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
