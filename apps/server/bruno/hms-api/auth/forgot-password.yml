info:
  name: Forgot Password
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:3000/api/auth/forgot-password
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
