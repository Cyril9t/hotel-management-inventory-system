info:
  name: Accept Invite
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/users/invites/accept"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{inviteToken}}",
        "password": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
