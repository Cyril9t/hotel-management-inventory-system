info:
  name: Get User By ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/users/{{userId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{userId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
