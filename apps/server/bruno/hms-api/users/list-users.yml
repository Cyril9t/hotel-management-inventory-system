info:
  name: List Users
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/users"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: role
      value: "{{role}}"
      type: query
    - name: department
      value: "{{department}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
