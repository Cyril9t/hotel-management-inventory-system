info:
  name: Reactivate User
  type: http
  seq: 7

http:
  method: PATCH
  url: http://localhost:3000/api/users/{{userId}}/reactivate
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{userId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
