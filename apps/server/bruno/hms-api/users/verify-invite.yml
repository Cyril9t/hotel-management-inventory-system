info:
  name: Verify Invite
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/users/invites/{{inviteToken}}/verify"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: token
      value: "{{inviteToken}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
