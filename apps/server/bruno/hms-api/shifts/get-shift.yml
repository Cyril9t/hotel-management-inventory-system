info:
  name: Get Shift Details
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/shifts/{{shiftId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{shiftId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
