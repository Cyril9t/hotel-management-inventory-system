info:
  name: Open Shift
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/shifts/open"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "openingCash": 100.00
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
