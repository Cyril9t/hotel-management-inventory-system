info:
  name: Close Shift
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/shifts/{{shiftId}}/close"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{shiftId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "actualCash": 150.00
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
