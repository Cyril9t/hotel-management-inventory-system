info:
  name: Get Current Shift
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/shifts/current"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
