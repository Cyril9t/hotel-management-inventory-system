info:
  name: Check-out Booking
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/bookings/{{bookingId}}/checkout"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{bookingId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
