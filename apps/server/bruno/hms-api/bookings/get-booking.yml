info:
  name: Get Booking
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/bookings/{{bookingId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{bookingId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
