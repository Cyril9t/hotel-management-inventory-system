info:
  name: List Audit Logs
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/audit"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: entityType
      value: "Room"
      type: query
    - name: actorUserId
      value: "{{userId}}"
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
