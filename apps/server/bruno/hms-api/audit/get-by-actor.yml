info:
  name: Get Logs by Actor
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/audit/actor/{{actorUserId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: actorUserId
      value: "{{userId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
