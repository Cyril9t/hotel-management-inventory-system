info:
  name: Get Logs by Entity
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/audit/entity/{{entityType}}/{{entityId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: entityType
      value: "Room"
      type: path
    - name: entityId
      value: "{{roomId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
