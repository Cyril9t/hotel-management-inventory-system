opencollection: 1.0.0

info:
  name: hms-api
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("token");
        req.setHeader("Authorization", `Bearer ${token}`);
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
