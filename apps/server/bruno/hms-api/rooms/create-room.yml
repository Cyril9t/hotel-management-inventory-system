info:
  name: Create Room
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/rooms"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "number": "101",
        "categoryId": "{{categoryId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
