info:
  name: Get Daily Report
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/reports"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: reportDate
      value: "2026-10-24"
      type: query
    - name: department
      value: "RESTAURANT"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
